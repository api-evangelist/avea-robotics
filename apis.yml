name: Avea Robotics
description: >-
  Avea Robotics is a San Francisco-based robotics software company (Y Combinator
  Spring 2026) building teleoperation software that lets operators control robots
  from anywhere in the world with ultra-low latency. Its product, Sentinel, provides
  real-time remote control, immersive viewing, haptic feedback, and multi-stream
  video so operators can remotely intervene and keep robots running continuously.
  The platform supports industrial robotic arms, humanoid robots, and custom
  systems, and targets use cases such as data collection for Physical AI training,
  remote real-world robot deployment, and supervised autonomy with human oversight.
  Integration is handled during onboarding by sharing a robot's URDF and joint
  control API rather than through a public developer API. As an early-stage startup,
  Avea Robotics publishes a website, Notion-hosted documentation, and a Substack
  blog, but does not yet expose a public REST API, OpenAPI specification, SDKs, or
  a self-serve developer platform.
